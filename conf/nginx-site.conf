limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=php:5m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name zxtunes.com www.zxtunes.com localhost;
    root /home/zxtunes/web/zxtunes.com/public_html;
    index authors_list.php;
    charset utf-8;
    server_tokens off;

    client_max_body_size 32m;
    client_body_timeout 30s;
    limit_conn addr 30;

    include /etc/nginx/security-headers.conf;

    location ~ /\.(?:ht|svn|git|env) { deny all; return 404; }
    location ~ /includes/ { deny all; return 404; }
    location ^~ /parser/ { deny all; return 404; }

    # Block known backdoors / debug scripts
    location = /test.php { deny all; return 404; }
    location = /images/do.php { deny all; return 404; }

    # No PHP execution in upload directories
    location ~* ^/(informer|photo|tunes)/.*\.ph(p[3457]?|tml|ar)$ { deny all; return 404; }

    # Author URL rewrite (from .htaccess)
    rewrite ^/([0-9]+)/([a-z0-9]+)/?$ /author.php?id=$1 last;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|eot|svg|zip|rar|7z|mp3|pt1|pt2|pt3|sqt|ay|ym|mod|swf)$ {
        expires 7d;
        try_files $uri =404;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/xml;
    gzip_min_length 1000;

    location ~ \.php$ {
        limit_req zone=php burst=15 nodelay;
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index authors_list.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        try_files $uri $uri/ /authors_list.php?$query_string;
    }
}
