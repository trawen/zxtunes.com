[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_value[open_basedir] = /home/zxtunes/web/zxtunes.com/public_html:/home/zxtunes/web/zxtunes.com/data:/home/zxtunes/tmp
php_admin_value[upload_tmp_dir] = /home/zxtunes/tmp
php_admin_value[session.save_path] = /home/zxtunes/tmp
php_flag[display_errors] = off

request_terminate_timeout = 60s
